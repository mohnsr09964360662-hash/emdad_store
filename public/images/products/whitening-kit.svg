        <polygon points="50,63 30,68 50,73" fill="#0F172A" />
      </g>
      <path d="M 0 50 L 5 60 L 15 65 L 5 70 L 0 80 L -5 70 L -15 65 L -5 60 Z" fill="#FBBF24" />
