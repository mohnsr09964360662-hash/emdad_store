<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 330" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- التدرج اللوني الأساسي للغلاف -->
    <linearGradient id="emdadBannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072E4C" />
      <stop offset="30%" stop-color="#0D5C96" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- إضاءة شعاعية مركزية خلف موضع الشعار الدائري -->
    <radialGradient id="centerAura" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0D5C96" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#072E4C" stop-opacity="0" />
    </radialGradient>

    <!-- إضاءة تركوازية ناعمة جانبية -->
    <radialGradient id="sideTurqAura" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#3DD9B3" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0" />
    </radialGradient>

    <!-- تدرجات الأمواج العضوية لميناء الأسنان -->
    <linearGradient id="waveGrad1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DD9B3" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.01" />
    </linearGradient>
  </defs>

  <!-- الخلفية الأساسية الممتدة -->
  <rect width="1920" height="330" fill="url(#emdadBannerBg)" />

  <!-- الإضاءة المحيطية المشعة -->
  <rect width="1920" height="330" fill="url(#centerAura)" />
  <rect width="1920" height="330" fill="url(#sideTurqAura)" />

  <!-- تموجات انسيابية سريرية -->
  <path d="M0,220 C400,160 800,280 1200,200 C1600,120 1800,240 1920,180 L1920,330 L0,330 Z" fill="url(#waveGrad1)" />
  <path d="M0,140 C500,260 950,130 1450,250 C1750,310 1850,220 1920,200 L1920,330 L0,330 Z" fill="url(#waveGrad2)" />

  <!-- شبكة هندسية خافتة للمختبرات السريرية -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.2" fill="none">
    <circle cx="250" cy="90" r="45" />
    <circle cx="250" cy="90" r="90" />
    <line x1="205" y1="90" x2="295" y2="90" />
    <line x1="250" y1="45" x2="250" y2="135" />

    <circle cx="1680" cy="110" r="50" />
    <circle cx="1680" cy="110" r="100" />
    <line x1="1630" y1="110" x2="1730" y2="110" />
    <line x1="1680" y1="60" x2="1680" y2="160" />
  </g>

  <!-- رموز طبية سريرية دقيقة (صليب طبي ناصع) -->
  <g fill="#FFFFFF" opacity="0.14">
    <path d="M120,70 h8 v-8 h6 v8 h8 v6 h-8 v8 h-6 v-8 h-8 z" />
    <path d="M480,180 h6 v-6 h4 v6 h6 v4 h-6 v6 h-4 v-6 h-6 z" opacity="0.6" />
    <path d="M1480,80 h8 v-8 h6 v8 h8 v6 h-8 v8 h-6 v-8 h-8 z" />
    <path d="M1800,190 h6 v-6 h4 v6 h6 v4 h-6 v6 h-4 v-6 h-6 z" opacity="0.7" />
  </g>

  <!-- نجوم اللمعان والتعقيم السريري -->
  <g fill="#3DD9B3" opacity="0.38">
    <polygon points="360,50 363,58 371,60 363,62 360,70 357,62 349,60 357,58" />
    <polygon points="1560,160 1563,168 1571,170 1563,172 1560,180 1557,172 1549,170 1557,168" />
  </g>
</svg>
