<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- تدرج السن الرئيسي: من التركواز اللامع إلى كحلي إمداد الملكي -->
    <linearGradient id="emdadToothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DD9B3" />
      <stop offset="45%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D5C96" />
    </linearGradient>
    <!-- تدرج الضلع السماوي الناصع -->
    <linearGradient id="emdadSkyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <!-- ظل ناعم لبروز الأيقونة في التبويبات الفاتحة والداكنة -->
    <filter id="toothShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#072E4C" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- خلفية دائرية بزوايا ناعمة بلون سماوي ثلجي ناصع -->
  <rect width="64" height="64" rx="16" fill="#F0F9FF" />

  <!-- هيكل السن المتدفق (حدود السن والتاج والجذور) -->
  <path d="M32 10 C24 10 16 13 14 22 C12 31 16 42 22 52 C24 55 27 55 28 51 C30 43 31 36 32 36 C33 36 34 43 36 51 C37 55 40 55 42 52 C48 42 52 31 50 22 C48 13 40 10 32 10 Z" fill="url(#emdadToothGrad)" filter="url(#toothShadow)" />

  <!-- الشريط الانسيابي الداخلي لرمز إمداد السريري -->
  <path d="M28 20 C34 18 42 22 44 28 C46 34 40 40 35 44 C34 41 35 34 38 30 C40 27 36 24 32 25 C29 26 28 23 28 20 Z" fill="url(#emdadSkyGrad)" opacity="0.92" />

  <!-- نجمة اللمعان السريرية في قمة التاج -->
  <circle cx="44" cy="18" r="2.5" fill="#3DD9B3" />
</svg>
