        <text x="330" y="93" fill="#94A3B8" font-size="11" text-anchor="end">أحمد محمد المحمود</text>

        <!-- Phone -->
        <text x="340" y="130" fill="#334155" font-size="11" font-weight="600" text-anchor="end">رقم الهاتف (سوريا) *</text>
        <rect x="15" y="140" width="330" height="36" rx="8" fill="#F8FAFC" stroke="#38BDF8"/>
        <text x="330" y="163" fill="#0D5C96" font-size="11" font-weight="bold" text-anchor="end">0981276182</text>
        <rect x="25" y="145" width="48" height="26" rx="5" fill="#E0F2FE"/>
        <text x="49" y="162" fill="#0D5C96" font-size="10" font-weight="bold" text-anchor="middle">+963</text>

        <!-- Governorate -->
        <text x="340" y="200" fill="#334155" font-size="11" font-weight="600" text-anchor="end">المحافظة *</text>
        <rect x="15" y="210" width="330" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="330" y="233" fill="#0D5C96" font-size="11" text-anchor="end">دمشق</text>
        <text x="30" y="233" fill="#64748B" font-size="11">▾</text>

        <!-- Address -->
        <text x="340" y="270" fill="#334155" font-size="11" font-weight="600" text-anchor="end">العنوان بالتفصيل *</text>
        <rect x="15" y="280" width="330" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="330" y="303" fill="#94A3B8" font-size="10" text-anchor="end">المزة - أوتستراد - جانب الكلية</text>

        <!-- Notes -->
        <text x="340" y="340" fill="#334155" font-size="11" font-weight="600" text-anchor="end">ملاحظات التوصيل</text>
        <rect x="15" y="350" width="330" height="50" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="330" y="373" fill="#94A3B8" font-size="10" text-anchor="end">يرجى التوصيل قبل 2 ظهراً...</text>

        <!-- Payment Method -->
        <text x="340" y="425" fill="#334155" font-size="11" font-weight="600" text-anchor="end">طريقة الدفع:</text>
        <rect x="15" y="435" width="330" height="36" rx="8" fill="#F0FDFA" stroke="#14B8A6"/>
        <circle cx="330" cy="453" r="5" fill="#14B8A6"/>
        <text x="315" y="457" fill="#0D5C96" font-size="10" font-weight="bold" text-anchor="end">الدفع عند الاستلام (COD) نقداً</text>

        <rect x="15" y="480" width="330" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
        <circle cx="330" cy="498" r="5" fill="#CBD5E1"/>
        <text x="315" y="502" fill="#64748B" font-size="10" text-anchor="end">سيريتل كاش / MTN كاش</text>

        <!-- Order Total Mobile -->
        <g transform="translate(15, 535)">
          <rect x="0" y="0" width="330" height="85" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
          <text x="315" y="28" fill="#64748B" font-size="11" text-anchor="end">المجموع الفرعي: 108,000 ل.س</text>
          <text x="315" y="50" fill="#14B8A6" font-size="11" font-weight="bold" text-anchor="end">الشحن: مجاناً (دمشق)</text>
