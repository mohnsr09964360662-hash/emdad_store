        <text x="180" y="27" fill="#FFFFFF" font-size="9" font-weight="bold" text-anchor="middle">2</text>
        <text x="140" y="27" fill="#0D5C96" font-size="10" font-weight="bold" text-anchor="end">التوصيل</text>
        <line x1="70" y1="23" x2="95" y2="23" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="3"/>
        <!-- Step 3 -->
