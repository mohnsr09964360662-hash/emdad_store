      <text x="195" y="30" fill="#0D5C96" font-size="13" font-weight="bold" text-anchor="middle">إتمام الطلب</text>
      <circle cx="30" cy="25" r="14" fill="#E0F2FE"/>
      <text x="30" y="29" fill="#0D5C96" font-size="11" font-weight="bold" text-anchor="middle">🛒 3</text>

      <!-- Stepper Mobile -->
