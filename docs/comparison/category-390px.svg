          <rect x="8" y="8" width="159" height="105" rx="6" fill="#F1F5F9"/>
          <text x="87" y="60" fill="#64748B" font-size="11" text-anchor="middle">مقبض مرآة</text>
          <text x="165" y="132" fill="#0F172A" font-size="11" font-weight="bold" text-anchor="end">مقبض مخرش</text>
          <text x="165" y="186" fill="#0F766E" font-size="12" font-weight="bold" text-anchor="end">18,000 ل.س</text>
        </g>
        <!-- Card 4 -->
        <g transform="translate(0, 225)">
          <rect x="0" y="0" width="175" height="210" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
          <rect x="8" y="8" width="159" height="105" rx="6" fill="#F1F5F9"/>
          <text x="87" y="60" fill="#64748B" font-size="11" text-anchor="middle">طقم فحص</text>
          <text x="165" y="132" fill="#0F172A" font-size="11" font-weight="bold" text-anchor="end">طقم فحص 3 قطع</text>
          <text x="165" y="186" fill="#0F766E" font-size="12" font-weight="bold" text-anchor="end">75,000 ل.س</text>
        </g>
      </g>
    </g>
  </g>

