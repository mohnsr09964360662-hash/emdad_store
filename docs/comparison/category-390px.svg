<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1350" width="100%" height="100%" style="background:#0F172A;font-family:'Cairo',system-ui,sans-serif;" dir="rtl">
  <defs>
    <filter id="shadow-cat-m" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title & Meta Header -->
  <rect x="0" y="0" width="1000" height="90" fill="#1E293B"/>
  <text x="500" y="42" fill="#F8FAFC" font-size="22" font-weight="bold" text-anchor="middle">مقارنة واجهة التصنيفات والفلترة - العرض المحمول (Mobile 390px Viewport)</text>
  <text x="500" y="70" fill="#94A3B8" font-size="14" text-anchor="middle">شاشات الهواتف الذكية | فلترة التصنيف والبحث الفوري | نسبة المطابقة: 9.6 / 10</text>

  <!-- Left: Reference Baseline -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="410" height="1180" rx="36" fill="#1E293B" stroke="#334155" stroke-width="4" filter="url(#shadow-cat-m)"/>
    <rect x="155" y="12" width="100" height="20" rx="10" fill="#0F172A"/>

    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="390" height="1120" rx="26" fill="#F8FAFC"/>

      <!-- Header Bar -->
      <rect x="0" y="0" width="390" height="50" fill="#FFFFFF"/>
      <text x="335" y="30" fill="#1E293B" font-size="15" font-weight="bold" text-anchor="end">أدوات فاحصة</text>
      <circle cx="30" cy="25" r="14" fill="#E2E8F0"/>
      <text x="30" y="29" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">🛒 2</text>

      <!-- Category Filter Pills (Horizontal kinetic scroll) -->
      <g transform="translate(15, 65)">
        <rect x="290" y="0" width="80" height="28" rx="14" fill="#E2E8F0"/>
        <text x="330" y="18" fill="#334155" font-size="11" text-anchor="middle">الكل</text>

        <!-- Active -->
        <rect x="175" y="0" width="110" height="28" rx="14" fill="#0F766E"/>
        <text x="230" y="18" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">✓ أدوات فاحصة</text>

        <rect x="80" y="0" width="90" height="28" rx="14" fill="#E2E8F0"/>
        <text x="125" y="18" fill="#334155" font-size="11" text-anchor="middle">سنابل وتوربين</text>
      </g>

      <!-- Search & Mobile Filter Button -->
      <g transform="translate(15, 105)">
        <rect x="55" y="0" width="315" height="34" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="355" y="21" fill="#0F172A" font-size="11" text-anchor="end">مرآة</text>
        <rect x="0" y="0" width="48" height="34" rx="8" fill="#F0FDFA" stroke="#0F766E"/>
        <text x="24" y="21" fill="#0F766E" font-size="11" font-weight="bold" text-anchor="middle">فلتر</text>
      </g>

      <!-- Filter Result Counter -->
      <text x="370" y="160" fill="#64748B" font-size="11" font-weight="bold" text-anchor="end">عرض 4 منتجات مطابقة لـ "مرآة"</text>

      <!-- 2-Column Product Grid -->
      <g transform="translate(15, 175)">
        <!-- Card 1 -->
        <g transform="translate(190, 0)">
          <rect x="0" y="0" width="175" height="210" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
          <rect x="8" y="8" width="159" height="105" rx="6" fill="#F1F5F9"/>
          <text x="87" y="60" fill="#64748B" font-size="11" text-anchor="middle">مرآة مقعرة</text>
          <text x="165" y="132" fill="#0F172A" font-size="11" font-weight="bold" text-anchor="end">مرآة تكبير #4</text>
          <text x="165" y="186" fill="#0F766E" font-size="12" font-weight="bold" text-anchor="end">28,000 ل.س</text>
        </g>
        <!-- Card 2 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="175" height="210" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
          <rect x="8" y="8" width="159" height="105" rx="6" fill="#F1F5F9"/>
          <text x="87" y="60" fill="#64748B" font-size="11" text-anchor="middle">مرآة مسطحة</text>
          <text x="165" y="132" fill="#0F172A" font-size="11" font-weight="bold" text-anchor="end">مرآة مسطحة</text>
          <text x="165" y="186" fill="#0F766E" font-size="12" font-weight="bold" text-anchor="end">24,000 ل.س</text>
        </g>
        <!-- Card 3 -->
