  <text x="960" y="42" fill="#F8FAFC" font-size="24" font-weight="bold" text-anchor="middle">مقارنة واجهة إتمام الطلب والتوصيل السوري (Syrian Delivery Checkout) - العرض المكتبي (1440px)</text>
  <text x="960" y="70" fill="#94A3B8" font-size="16" text-anchor="middle">المتجر المرجعي (الأساس) مقابل متجر إمداد لمستلزمات طب الأسنان | نموذج المحافظات والواتساب السوري | نسبة المطابقة: 9.8 / 10</text>

  <!-- Left: Reference Baseline -->
