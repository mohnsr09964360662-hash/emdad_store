<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقارنة التصنيفات والفلترة - متجر إمداد</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background: #0F172A; color: #F8FAFC; margin: 0; padding: 24px; }
    .header { max-width: 1300px; margin: 0 auto 24px; background: #1E293B; padding: 20px 30px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 24px; color: #38BDF8; margin: 0; }
    .header a { color: #14B8A6; text-decoration: none; font-weight: bold; }
    .container { max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
    .section-card { background: #1E293B; border-radius: 16px; padding: 24px; border: 1px solid #334155; }
    .section-card h2 { font-size: 20px; color: #F8FAFC; margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .img-wrap { display: flex; justify-content: center; }
    .img-wrap img { max-width: 100%; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>مقارنة واجهة التصنيفات والفلترة (Category & Filter View)</h1>
    <a href="index.html">← العودة للبوابة الشاملة</a>
  </div>
  <div class="container">
    <div class="section-card">
      <h2>العرض المكتبي (Desktop 1440px Viewport) — نسبة المطابقة: 9.7 / 10</h2>
      <div class="img-wrap">
        <img src="category-1440px.svg" alt="Desktop Category Comparison">
      </div>
    </div>
    <div class="section-card">
      <h2>العرض المحمول (Mobile 390px Viewport) — نسبة المطابقة: 9.6 / 10</h2>
      <div class="img-wrap">
        <img src="category-390px.svg" alt="Mobile Category Comparison">
      </div>
    </div>
  </div>
</body>
</html>
