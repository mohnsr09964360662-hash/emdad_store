    <g transform="translate(435, 45)">
      <rect x="0" y="0" width="440" height="1000" rx="0" fill="#FFFFFF" filter="url(#shadow-drawer)"/>

      <!-- Drawer Header -->
      <rect x="0" y="0" width="440" height="70" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="45" cy="35" r="16" fill="#F1F5F9"/>
      <text x="45" y="41" fill="#64748B" font-size="15" font-weight="bold" text-anchor="middle">✕</text>
      <text x="395" y="42" fill="#0D5C96" font-size="18" font-weight="bold" text-anchor="end">سلة التسوق</text>
      <rect x="260" y="23" width="40" height="24" rx="12" fill="#E0F2FE"/>
      <text x="280" y="39" fill="#0D5C96" font-size="12" font-weight="bold" text-anchor="middle">3</text>

      <!-- Cart Item 1 (Quantity = 2, Normal minus) -->
      <g transform="translate(20, 90)">
        <rect x="0" y="0" width="400" height="110" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="290" y="10" width="90" height="90" rx="8" fill="#F8FAFC" stroke="#38BDF8"/>
        <!-- Safe SVG illustration -->
        <circle cx="335" cy="50" r="22" fill="#E0F2FE"/>
        <circle cx="335" cy="50" r="16" fill="#FFFFFF" stroke="#0D5C96" stroke-width="2"/>
        <line x1="335" y1="66" x2="335" y2="90" stroke="#0D5C96" stroke-width="5" stroke-linecap="round"/>
        <text x="275" y="35" fill="#0D5C96" font-size="13" font-weight="bold" text-anchor="end">مرآة فحص مع مقبض</text>
        <text x="275" y="55" fill="#64748B" font-size="11" text-anchor="end">25,000 ل.س / قطعة</text>
        <!-- Stepper (Qty = 2) -->
        <rect x="15" y="60" width="100" height="32" rx="8" fill="#F8FAFC" stroke="#38BDF8"/>
        <text x="30" y="81" fill="#0D5C96" font-size="14" font-weight="bold" text-anchor="middle">+</text>
        <text x="65" y="81" fill="#0F172A" font-size="13" font-weight="bold" text-anchor="middle">2</text>
        <text x="95" y="81" fill="#64748B" font-size="14" font-weight="bold" text-anchor="middle">-</text>
        <text x="275" y="82" fill="#0D5C96" font-size="13" font-weight="bold" text-anchor="end">50,000 ل.س</text>
      </g>

      <!-- Cart Item 2 (Quantity = 1, Minus becomes Trash Can Icon 🗑) -->
      <g transform="translate(20, 215)">
        <rect x="0" y="0" width="400" height="110" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="290" y="10" width="90" height="90" rx="8" fill="#F8FAFC" stroke="#38BDF8"/>
        <text x="335" y="58" fill="#0D5C96" font-size="11" font-weight="bold" text-anchor="middle">ملقط سني</text>
        <text x="275" y="35" fill="#0D5C96" font-size="13" font-weight="bold" text-anchor="end">ملقط قطن مسنن</text>
        <text x="275" y="55" fill="#64748B" font-size="11" text-anchor="end">30,000 ل.س / قطعة</text>
        <!-- Stepper (Qty = 1: Red Trash Toggle Highlighted) -->
        <rect x="15" y="60" width="100" height="32" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
        <text x="30" y="81" fill="#0D5C96" font-size="14" font-weight="bold" text-anchor="middle">+</text>
        <text x="65" y="81" fill="#0F172A" font-size="13" font-weight="bold" text-anchor="middle">1</text>
        <text x="95" y="82" fill="#EF4444" font-size="13" font-weight="bold" text-anchor="middle">🗑</text>
        <text x="275" y="82" fill="#0D5C96" font-size="13" font-weight="bold" text-anchor="end">30,000 ل.س</text>
      </g>

      <!-- Cart Item 3 -->
      <g transform="translate(20, 340)">
        <rect x="0" y="0" width="400" height="110" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="290" y="10" width="90" height="90" rx="8" fill="#F8FAFC" stroke="#38BDF8"/>
        <text x="335" y="58" fill="#0D5C96" font-size="11" font-weight="bold" text-anchor="middle">مسبار فحص</text>
        <text x="275" y="35" fill="#0D5C96" font-size="13" font-weight="bold" text-anchor="end">مسبار فحص مزدوج</text>
        <text x="275" y="55" fill="#64748B" font-size="11" text-anchor="end">28,000 ل.س / قطعة</text>
        <rect x="15" y="60" width="100" height="32" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
        <text x="30" y="81" fill="#0D5C96" font-size="14" font-weight="bold" text-anchor="middle">+</text>
        <text x="65" y="81" fill="#0F172A" font-size="13" font-weight="bold" text-anchor="middle">1</text>
        <text x="95" y="82" fill="#EF4444" font-size="13" font-weight="bold" text-anchor="middle">🗑</text>
        <text x="275" y="82" fill="#0D5C96" font-size="13" font-weight="bold" text-anchor="end">28,000 ل.س</text>
      </g>

      <!-- Drawer Footer & Checkout Action -->
      <g transform="translate(0, 800)">
        <rect x="0" y="0" width="440" height="200" fill="#F8FAFC" stroke="#E2E8F0"/>
        <!-- Subtotal -->
        <text x="35" y="45" fill="#0D5C96" font-size="20" font-weight="bold">108,000 ل.س</text>
        <text x="405" y="45" fill="#0D5C96" font-size="15" font-weight="bold" text-anchor="end">المجموع الفرعي:</text>
        <text x="405" y="70" fill="#64748B" font-size="12" text-anchor="end">الشحن والتوصيل يحسب عند إدخال العنوان</text>

        <!-- Checkout Button -->
        <rect x="20" y="100" width="400" height="52" rx="12" fill="#0D5C96"/>
        <text x="220" y="132" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">متابعة الطلب والدفع ←</text>
      </g>
