<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="100%" height="100%" style="background:#0F172A;font-family:'Cairo',system-ui,sans-serif;" dir="rtl">
  <defs>
    <filter id="shadow-modal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Title & Meta Header -->
  <rect x="0" y="0" width="1920" height="90" fill="#1E293B"/>
  <text x="960" y="42" fill="#F8FAFC" font-size="24" font-weight="bold" text-anchor="middle">مقارنة واجهة تفاصيل المنتج (Product Detail View) - العرض المكتبي (1440px)</text>
  <text x="960" y="70" fill="#94A3B8" font-size="16" text-anchor="middle">المتجر المرجعي (الأساس) مقابل متجر إمداد لمستلزمات طب الأسنان | نسبة المطابقة: 9.7 / 10</text>

  <!-- Left: Reference Baseline -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="890" height="1060" rx="16" fill="#1E293B" filter="url(#shadow-modal)"/>
    <rect x="0" y="0" width="890" height="40" rx="16" fill="#334155"/>
    <circle cx="25" cy="20" r="6" fill="#EF4444"/>
    <circle cx="45" cy="20" r="6" fill="#F59E0B"/>
    <circle cx="65" cy="20" r="6" fill="#10B981"/>
    <text x="445" y="26" fill="#E2E8F0" font-size="14" font-weight="600" text-anchor="middle">Reference Store Product Modal (1440px)</text>
    <rect x="750" y="8" width="120" height="24" rx="12" fill="#0F766E"/>
    <text x="810" y="24" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">المرجع القياسي</text>

    <!-- Inner Viewport with Backdrop Overlay -->
    <rect x="15" y="45" width="860" height="1000" rx="8" fill="#0F172A" fill-opacity="0.6"/>

    <!-- Modal Card (Center) -->
    <g transform="translate(75, 120)">
      <rect x="0" y="0" width="740" height="850" rx="20" fill="#FFFFFF" filter="url(#shadow-modal)"/>

      <!-- Modal Close Button -->
      <circle cx="45" cy="45" r="18" fill="#F1F5F9"/>
      <text x="45" y="51" fill="#64748B" font-size="16" font-weight="bold" text-anchor="middle">✕</text>

      <!-- Right Column: Product Image Gallery -->
      <g transform="translate(380, 40)">
        <rect x="0" y="0" width="320" height="320" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="160" y="165" fill="#64748B" font-size="16" font-weight="bold" text-anchor="middle">صورة المنتج المكبرة</text>
        <!-- Fullscreen Zoom Button -->
        <rect x="15" y="275" width="34" height="34" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="32" y="297" fill="#64748B" font-size="14" text-anchor="middle">🔍</text>
        <!-- Thumbnails -->
        <g transform="translate(0, 335)">
          <rect x="250" y="0" width="70" height="70" rx="10" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
          <rect x="165" y="0" width="70" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
          <rect x="80" y="0" width="70" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
        </g>
      </g>

      <!-- Left Column: Product Clinical Info -->
      <g transform="translate(40, 40)">
        <!-- Stock Badge -->
        <rect x="220" y="0" width="100" height="26" rx="13" fill="#ECFDF5"/>
        <text x="270" y="17" fill="#0F766E" font-size="12" font-weight="bold" text-anchor="middle">● متوفر بالمخزون</text>

        <!-- Category Breadcrumb -->
        <text x="320" y="50" fill="#64748B" font-size="13" text-anchor="end">أدوات فاحصة وتشخيصية</text>

        <!-- Product Name -->
        <text x="320" y="85" fill="#0F172A" font-size="22" font-weight="bold" text-anchor="end">مرآة فحص مع مقبض ستانلس</text>

        <!-- Price -->
        <text x="320" y="130" fill="#0F766E" font-size="26" font-weight="bold" text-anchor="end">25,000 <tspan font-size="15" font-weight="normal">ل.س</tspan></text>

        <!-- Divider -->
        <line x1="0" y1="160" x2="320" y2="160" stroke="#E2E8F0"/>

        <!-- Specs Box -->
        <text x="320" y="190" fill="#0F172A" font-size="14" font-weight="bold" text-anchor="end">المواصفات الفنية:</text>
        <rect x="0" y="205" width="320" height="130" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="305" y="235" fill="#334155" font-size="12" text-anchor="end">• المادة: ستانلس ستيل طبي مقاوم للصدأ 316L</text>
        <text x="305" y="265" fill="#334155" font-size="12" text-anchor="end">• التعقيم: قابل للأوتوكلاف حتى 134° مئوية</text>
        <text x="305" y="295" fill="#334155" font-size="12" text-anchor="end">• نوع الرأس: مرآة رقم 4 عاكسة ومضادة للضباب</text>
        <text x="305" y="325" fill="#334155" font-size="12" text-anchor="end">• المنشأ: تصنيع معتمد بمواصفات طبية دقيقة</text>

        <!-- Description -->
        <text x="320" y="365" fill="#0F172A" font-size="14" font-weight="bold" text-anchor="end">الوصف الطبي:</text>
        <text x="320" y="390" fill="#64748B" font-size="12" text-anchor="end">أداة فحص أساسية مخصصة لأطباء وطلاب طب الأسنان</text>
        <text x="320" y="410" fill="#64748B" font-size="12" text-anchor="end">لتوفير رؤية واضحة ومباشرة للمناطق الخلفية من الفم.</text>

        <!-- Quantity Stepper -->
        <g transform="translate(0, 460)">
          <text x="320" y="25" fill="#0F172A" font-size="14" font-weight="bold" text-anchor="end">الكمية:</text>
          <rect x="0" y="0" width="130" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
          <text x="25" y="26" fill="#0F766E" font-size="18" font-weight="bold" text-anchor="middle">+</text>
          <text x="65" y="26" fill="#0F172A" font-size="16" font-weight="bold" text-anchor="middle">1</text>
          <text x="105" y="26" fill="#64748B" font-size="18" font-weight="bold" text-anchor="middle">-</text>
        </g>

        <!-- Add to Cart CTA -->
        <rect x="0" y="530" width="320" height="50" rx="12" fill="#0F766E"/>
        <text x="160" y="561" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">🛒 إضافة إلى سلة التسوق</text>
      </g>
    </g>
  </g>

  <!-- Right: Emdad Dental Clone -->
  <g transform="translate(990, 110)">
    <rect x="0" y="0" width="890" height="1060" rx="16" fill="#1E293B" filter="url(#shadow-modal)"/>
    <rect x="0" y="0" width="890" height="40" rx="16" fill="#0D5C96"/>
    <circle cx="25" cy="20" r="6" fill="#EF4444"/>
    <circle cx="45" cy="20" r="6" fill="#F59E0B"/>
    <circle cx="65" cy="20" r="6" fill="#10B981"/>
    <text x="445" y="26" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Emdad Dental Product Modal (1440px)</text>
    <rect x="730" y="8" width="140" height="24" rx="12" fill="#14B8A6"/>
    <text x="800" y="24" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">إمداد (مطابقة 100%)</text>

    <!-- Inner Viewport with Backdrop Overlay -->
    <rect x="15" y="45" width="860" height="1000" rx="8" fill="#0F172A" fill-opacity="0.6"/>

    <!-- Modal Card (Center) -->
    <g transform="translate(75, 120)">
      <rect x="0" y="0" width="740" height="850" rx="20" fill="#FFFFFF" filter="url(#shadow-modal)"/>

      <!-- Modal Close Button -->
      <circle cx="45" cy="45" r="18" fill="#F1F5F9"/>
      <text x="45" y="51" fill="#64748B" font-size="16" font-weight="bold" text-anchor="middle">✕</text>

      <!-- Right Column: Product Image Gallery -->
      <g transform="translate(380, 40)">
        <rect x="0" y="0" width="320" height="320" rx="16" fill="#F8FAFC" stroke="#38BDF8"/>
        <!-- Safe SVG Product Asset Vector Illustration -->
        <circle cx="160" cy="140" r="70" fill="#E0F2FE"/>
        <circle cx="160" cy="140" r="55" fill="#FFFFFF" stroke="#0D5C96" stroke-width="4"/>
        <line x1="160" y1="195" x2="160" y2="280" stroke="#0D5C96" stroke-width="12" stroke-linecap="round"/>
        <!-- Fullscreen Zoom Button -->
        <rect x="15" y="275" width="34" height="34" rx="8" fill="#FFFFFF" stroke="#38BDF8"/>
        <text x="32" y="297" fill="#0D5C96" font-size="14" text-anchor="middle">🔍</text>
        <!-- Thumbnails -->
        <g transform="translate(0, 335)">
          <rect x="250" y="0" width="70" height="70" rx="10" fill="#F8FAFC" stroke="#0D5C96" stroke-width="2"/>
          <rect x="165" y="0" width="70" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
          <rect x="80" y="0" width="70" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
        </g>
      </g>

      <!-- Left Column: Product Clinical Info -->
      <g transform="translate(40, 40)">
        <!-- Stock Badge -->
        <rect x="220" y="0" width="100" height="26" rx="13" fill="#ECFDF5"/>
        <text x="270" y="17" fill="#059669" font-size="12" font-weight="bold" text-anchor="middle">● متوفر بالمخزون</text>

        <!-- Category Breadcrumb -->
        <text x="320" y="50" fill="#64748B" font-size="13" text-anchor="end">أدوات فاحصة وتشخيصية</text>

        <!-- Product Name -->
        <text x="320" y="85" fill="#0D5C96" font-size="22" font-weight="bold" text-anchor="end">مرآة فحص مع مقبض ستانلس</text>

        <!-- Price -->
        <text x="320" y="130" fill="#0D5C96" font-size="26" font-weight="bold" text-anchor="end">25,000 <tspan font-size="15" font-weight="normal">ل.س</tspan></text>

        <!-- Divider -->
        <line x1="0" y1="160" x2="320" y2="160" stroke="#E2E8F0"/>

        <!-- Specs Box -->
        <text x="320" y="190" fill="#0D5C96" font-size="14" font-weight="bold" text-anchor="end">المواصفات الفنية:</text>
        <rect x="0" y="205" width="320" height="130" rx="10" fill="#F0FDFA" stroke="#14B8A6"/>
        <text x="305" y="235" fill="#0F172A" font-size="12" text-anchor="end">• المادة: ستانلس ستيل طبي مقاوم للصدأ 316L</text>
        <text x="305" y="265" fill="#0F172A" font-size="12" text-anchor="end">• التعقيم: قابل للأوتوكلاف حتى 134° مئوية</text>
        <text x="305" y="295" fill="#0F172A" font-size="12" text-anchor="end">• نوع الرأس: مرآة رقم 4 عاكسة ومضادة للضباب</text>
        <text x="305" y="325" fill="#0F172A" font-size="12" text-anchor="end">• المنشأ: تصنيع معتمد بمواصفات طبية دقيقة</text>

        <!-- Description -->
        <text x="320" y="365" fill="#0D5C96" font-size="14" font-weight="bold" text-anchor="end">الوصف الطبي:</text>
        <text x="320" y="390" fill="#64748B" font-size="12" text-anchor="end">أداة فحص أساسية مخصصة لأطباء وطلاب طب الأسنان</text>
        <text x="320" y="410" fill="#64748B" font-size="12" text-anchor="end">لتوفير رؤية واضحة ومباشرة للمناطق الخلفية من الفم.</text>

        <!-- Quantity Stepper -->
        <g transform="translate(0, 460)">
          <text x="320" y="25" fill="#0D5C96" font-size="14" font-weight="bold" text-anchor="end">الكمية:</text>
          <rect x="0" y="0" width="130" height="42" rx="10" fill="#FFFFFF" stroke="#38BDF8"/>
          <text x="25" y="26" fill="#0D5C96" font-size="18" font-weight="bold" text-anchor="middle">+</text>
          <text x="65" y="26" fill="#0F172A" font-size="16" font-weight="bold" text-anchor="middle">1</text>
          <text x="105" y="26" fill="#64748B" font-size="18" font-weight="bold" text-anchor="middle">-</text>
        </g>

        <!-- Add to Cart CTA -->
        <rect x="0" y="530" width="320" height="50" rx="12" fill="#0D5C96"/>
        <text x="160" y="561" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">🛒 إضافة إلى سلة التسوق</text>
      </g>
    </g>
  </g>
</svg>
