<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1350" width="100%" height="100%" style="background:#0F172A;font-family:'Cairo',system-ui,sans-serif;" dir="rtl">
  <defs>
    <filter id="shadow-modal-m" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title & Meta Header -->
  <rect x="0" y="0" width="1000" height="90" fill="#1E293B"/>
  <text x="500" y="42" fill="#F8FAFC" font-size="22" font-weight="bold" text-anchor="middle">مقارنة واجهة تفاصيل المنتج - العرض المحمول (Mobile 390px Viewport)</text>
  <text x="500" y="70" fill="#94A3B8" font-size="14" text-anchor="middle">شاشات الهواتف الذكية | شريط الشراء السفلي المثبت (Sticky Action Bar) | نسبة المطابقة: 9.7 / 10</text>

  <!-- Left: Reference Baseline -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="410" height="1180" rx="36" fill="#1E293B" stroke="#334155" stroke-width="4" filter="url(#shadow-modal-m)"/>
    <rect x="155" y="12" width="100" height="20" rx="10" fill="#0F172A"/>

    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="390" height="1120" rx="26" fill="#F8FAFC"/>

      <!-- Header with Return Button -->
      <rect x="0" y="0" width="390" height="50" fill="#FFFFFF"/>
      <text x="330" y="30" fill="#1E293B" font-size="14" font-weight="bold" text-anchor="end">← العودة</text>
      <text x="195" y="30" fill="#64748B" font-size="13" font-weight="bold" text-anchor="middle">تفاصيل المنتج</text>
      <circle cx="30" cy="25" r="14" fill="#E2E8F0"/>
      <text x="30" y="29" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">🛒</text>

      <!-- Main Product Image -->
      <g transform="translate(15, 65)">
        <rect x="0" y="0" width="360" height="260" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="180" y="135" fill="#64748B" font-size="14" font-weight="bold" text-anchor="middle">صورة المنتج</text>
        <!-- Badge -->
        <rect x="250" y="15" width="95" height="24" rx="12" fill="#ECFDF5"/>
        <text x="297" y="31" fill="#0F766E" font-size="11" font-weight="bold" text-anchor="middle">● متوفر بالمخزون</text>
      </g>

      <!-- Clinical Information Body -->
      <g transform="translate(15, 345)">
        <text x="360" y="20" fill="#64748B" font-size="11" text-anchor="end">أدوات فاحصة وتشخيصية</text>
        <text x="360" y="48" fill="#0F172A" font-size="18" font-weight="bold" text-anchor="end">مرآة فحص مع مقبض ستانلس</text>
        <text x="360" y="85" fill="#0F766E" font-size="22" font-weight="bold" text-anchor="end">25,000 <tspan font-size="13" font-weight="normal">ل.س</tspan></text>

        <!-- Divider -->
        <line x1="0" y1="105" x2="360" y2="105" stroke="#E2E8F0"/>

        <!-- Clinical Specs Box -->
        <text x="360" y="135" fill="#0F172A" font-size="13" font-weight="bold" text-anchor="end">المواصفات الفنية:</text>
        <rect x="0" y="148" width="360" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="345" y="175" fill="#334155" font-size="11" text-anchor="end">• ستانلس ستيل طبي 316L مقاوم للصدأ</text>
        <text x="345" y="200" fill="#334155" font-size="11" text-anchor="end">• قابل للتعقيم بالأوتوكلاف 134°C</text>
        <text x="345" y="225" fill="#334155" font-size="11" text-anchor="end">• مرآة مقعرة رقم 4 عالية النقاء</text>
        <text x="345" y="250" fill="#334155" font-size="11" text-anchor="end">• تعبئة فردية محكمة ومعقمة</text>

        <!-- Description Box -->
        <text x="360" y="295" fill="#0F172A" font-size="13" font-weight="bold" text-anchor="end">الوصف الطبي والميزات:</text>
        <rect x="0" y="308" width="360" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="345" y="335" fill="#64748B" font-size="11" text-anchor="end">أداة قياسية لا غنى عنها في كل عيادة سنية،</text>
        <text x="345" y="358" fill="#64748B" font-size="11" text-anchor="end">توفر مقبض مخرش مانع للانزلاق ورؤية نقية.</text>
      </g>

      <!-- Sticky Bottom Action Bar -->
      <g transform="translate(0, 1045)">
        <rect x="0" y="0" width="390" height="75" fill="#FFFFFF" stroke="#CBD5E1"/>
        <!-- Stepper -->
        <rect x="260" y="16" width="115" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="280" y="42" fill="#0F766E" font-size="16" font-weight="bold" text-anchor="middle">+</text>
        <text x="317" y="42" fill="#0F172A" font-size="15" font-weight="bold" text-anchor="middle">1</text>
        <text x="355" y="42" fill="#64748B" font-size="16" font-weight="bold" text-anchor="middle">-</text>
        <!-- CTA Button -->
        <rect x="15" y="16" width="235" height="42" rx="10" fill="#0F766E"/>
        <text x="132" y="42" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">🛒 أضف إلى السلة</text>
      </g>
    </g>
  </g>

  <!-- Right: Emdad Dental Clone -->
  <g transform="translate(530, 110)">
    <rect x="0" y="0" width="410" height="1180" rx="36" fill="#1E293B" stroke="#0D5C96" stroke-width="4" filter="url(#shadow-modal-m)"/>
    <rect x="155" y="12" width="100" height="20" rx="10" fill="#0F172A"/>

    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="390" height="1120" rx="26" fill="#F8FAFC"/>

      <!-- Header with Return Button -->
      <rect x="0" y="0" width="390" height="50" fill="#FFFFFF"/>
      <text x="330" y="30" fill="#0D5C96" font-size="14" font-weight="bold" text-anchor="end">← العودة</text>
      <text x="195" y="30" fill="#0D5C96" font-size="13" font-weight="bold" text-anchor="middle">تفاصيل المنتج</text>
      <circle cx="30" cy="25" r="14" fill="#E0F2FE"/>
      <text x="30" y="29" fill="#0D5C96" font-size="11" font-weight="bold" text-anchor="middle">🛒</text>

      <!-- Main Product Image -->
      <g transform="translate(15, 65)">
        <rect x="0" y="0" width="360" height="260" rx="16" fill="#FFFFFF" stroke="#38BDF8"/>
        <!-- Safe SVG illustration -->
        <circle cx="180" cy="115" r="55" fill="#E0F2FE"/>
        <circle cx="180" cy="115" r="42" fill="#FFFFFF" stroke="#0D5C96" stroke-width="3"/>
        <line x1="180" y1="157" x2="180" y2="230" stroke="#0D5C96" stroke-width="10" stroke-linecap="round"/>
        <!-- Badge -->
        <rect x="250" y="15" width="95" height="24" rx="12" fill="#ECFDF5"/>
        <text x="297" y="31" fill="#059669" font-size="11" font-weight="bold" text-anchor="middle">● متوفر بالمخزون</text>
      </g>

      <!-- Clinical Information Body -->
      <g transform="translate(15, 345)">
        <text x="360" y="20" fill="#64748B" font-size="11" text-anchor="end">أدوات فاحصة وتشخيصية</text>
        <text x="360" y="48" fill="#0D5C96" font-size="18" font-weight="bold" text-anchor="end">مرآة فحص مع مقبض ستانلس</text>
        <text x="360" y="85" fill="#0D5C96" font-size="22" font-weight="bold" text-anchor="end">25,000 <tspan font-size="13" font-weight="normal">ل.س</tspan></text>

        <!-- Divider -->
        <line x1="0" y1="105" x2="360" y2="105" stroke="#E2E8F0"/>

        <!-- Clinical Specs Box -->
        <text x="360" y="135" fill="#0D5C96" font-size="13" font-weight="bold" text-anchor="end">المواصفات الفنية:</text>
        <rect x="0" y="148" width="360" height="120" rx="10" fill="#F0FDFA" stroke="#14B8A6"/>
        <text x="345" y="175" fill="#0F172A" font-size="11" text-anchor="end">• ستانلس ستيل طبي 316L مقاوم للصدأ</text>
        <text x="345" y="200" fill="#0F172A" font-size="11" text-anchor="end">• قابل للتعقيم بالأوتوكلاف 134°C</text>
        <text x="345" y="225" fill="#0F172A" font-size="11" text-anchor="end">• مرآة مقعرة رقم 4 عالية النقاء</text>
        <text x="345" y="250" fill="#0F172A" font-size="11" text-anchor="end">• تعبئة فردية محكمة ومعقمة</text>

        <!-- Description Box -->
        <text x="360" y="295" fill="#0D5C96" font-size="13" font-weight="bold" text-anchor="end">الوصف الطبي والميزات:</text>
        <rect x="0" y="308" width="360" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="345" y="335" fill="#64748B" font-size="11" text-anchor="end">أداة قياسية لا غنى عنها في كل عيادة سنية،</text>
        <text x="345" y="358" fill="#64748B" font-size="11" text-anchor="end">توفر مقبض مخرش مانع للانزلاق ورؤية نقية.</text>
      </g>

      <!-- Sticky Bottom Action Bar -->
      <g transform="translate(0, 1045)">
        <rect x="0" y="0" width="390" height="75" fill="#FFFFFF" stroke="#CBD5E1"/>
        <!-- Stepper -->
        <rect x="260" y="16" width="115" height="42" rx="10" fill="#FFFFFF" stroke="#38BDF8"/>
        <text x="280" y="42" fill="#0D5C96" font-size="16" font-weight="bold" text-anchor="middle">+</text>
        <text x="317" y="42" fill="#0F172A" font-size="15" font-weight="bold" text-anchor="middle">1</text>
        <text x="355" y="42" fill="#64748B" font-size="16" font-weight="bold" text-anchor="middle">-</text>
        <!-- CTA Button -->
        <rect x="15" y="16" width="235" height="42" rx="10" fill="#0D5C96"/>
        <text x="132" y="42" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">🛒 أضف إلى السلة</text>
      </g>
    </g>
  </g>
</svg>
